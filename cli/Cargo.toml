[package]
name = "opensnitch-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
description = "Command line management of the rules of a running OpenSnitch daemon"
license = "MIT"

# The daemon dials the address of its Server, and speaks the `UI` service there
# (daemon/ui/client.go), so this program is the daemon's peer: it listens, the
# daemon connects, and rules are read from Subscribe() and changed through the
# Notifications channel. Nothing here comes from the GTK UI: no gtk, no
# libadwaita, no D-Bus.
[dependencies]
prost = "0.14.4"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tonic-prost-build = "0.14.6"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
