[package]
name = "opensnitch-ui-gtk4"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
description = "GTK4 UI for OpenSnitch"
license = "MIT"

# `cli/` is the companion command line program: a peer of opensnitchd itself, with
# no GTK in its tree, so `cargo build -p opensnitch-cli` never pulls gtk4 or
# libadwaita. The workspace shares one Cargo.lock and the `[patch]` below, which
# the CLI needs for the same reason this program does.
[workspace]
members = ["cli"]
resolver = "3"

[dependencies]
async-channel = "2.5.0"
gtk4 = "0.11.5"
libadwaita = { version = "0.9.2", features = ["v1_6"] }
prost = "0.14.4"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
# `ksni`: the tray talks to the desktop's status notifier host itself, so no
# GTK3/AppIndicator is pulled next to GTK4. `muda-gtk4`: the menu uses the same
# GTK as the rest of the program.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni", "muda-gtk4"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"

[build-dependencies]
tonic-prost-build = "0.14.6"

# The opensnitchd old gRPC library sends an invalid ":authority"
# that h2 rejects, this fork fixes the issue.
[patch.crates-io]
h2 = { git = "https://github.com/jeronimoalbi/h2", branch = "snitch-authority" }
